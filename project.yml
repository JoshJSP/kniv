name: Kniv
options:
  bundleIdPrefix: com.joshjsp
  developmentLanguage: nl
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    majorVersion: 2.0.0
targets:
  Kniv:
    type: application
    platform: iOS
    sources: [Kniv]
    dependencies:
      - target: KnivWidgets
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshjsp.kniv
        PRODUCT_NAME: Kniv
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Kniv/Info.plist
      properties:
        CFBundleDisplayName: Kniv
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.joshjsp.kniv
            CFBundleURLSchemes: [kniv]
        NSMicrophoneUsageDescription: Kniv luistert alleen terwijl je inspreekt.
        NSSpeechRecognitionUsageDescription: Kniv schrijft je ingesproken notities uit, op je iPhone zelf.
        NSCameraUsageDescription: Kniv maakt foto's van papiertjes, whiteboards en bonnetjes.
        NSMotionUsageDescription: Kniv leest de barometer om te laten zien hoeveel verdiepingen je omhoog bent gegaan.
        NSLocationWhenInUseUsageDescription: Kniv bewaart een plek, zodat hij je daar kan herinneren.
        NSLocationAlwaysAndWhenInUseUsageDescription: Kniv laat je bij de supermarkt, op school of thuis je lijstje zien, ook als de app dicht is.
        NSContactsUsageDescription: Kniv zoekt wie je wilt bellen als je 'oma bellen' noteert.
        NSCalendarsWriteOnlyAccessUsageDescription: Kniv zet een afspraak uit je notitie in je agenda.
        NSPhotoLibraryAddUsageDescription: Kniv bewaart een kaartje van je week in je foto's als je daarvoor kiest.
        NSFaceIDUsageDescription: Kniv opent vergrendelde bakjes met Face ID.
        NSCalendarsFullAccessUsageDescription: Kniv kijkt in je agenda om een herinnering op een vrij moment te zetten.
  KnivWidgets:
    type: app-extension
    platform: iOS
    sources: [KnivWidgets, Kniv/Gedeeld]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshjsp.kniv.widgets
        PRODUCT_NAME: KnivWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: KnivWidgets/Info.plist
      properties:
        CFBundleDisplayName: Kniv
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
